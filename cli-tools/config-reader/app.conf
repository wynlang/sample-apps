# app.conf -- shipped deliberately imperfect, so the validator has something to catch.
# Sections nest keys: [server] + port  =>  "server.port".

[app]
name    = "Wyn Config Reader"
version = "2.0.0"
debug   = false

[server]
host    = "0.0.0.0"
port    = 99999            # out of range: ports are 1..65535
workers = "four"           # should be an int, not a string
timeout = 2.5
keepalive true             # malformed: no '=' at all

[database]
host    = "db.internal"
port    = 5432
pool    = 8
# note: database.name is required by the schema and missing on purpose

[logging]
level   = "info"
colour  = true             # unknown key: not in the schema
